[project]
name = "key-transcriptor-backend"
version = "0.1.0"
description = "Audio to MIDI transcription backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "basic-pitch<0.3.6",
    "mido>=1.3.2",
    "yt-dlp>=2024.1.0",
]


[dependency-groups]
dev = []

[tool.uv]
override-dependencies = [
    "tensorflow-io-gcs-filesystem ; sys_platform != 'win32'",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
